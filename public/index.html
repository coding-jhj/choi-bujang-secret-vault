<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    form { display: grid; gap: 10px; margin: 22px 0; }
    input, textarea, button { font: inherit; padding: 11px 13px; border-radius: 10px; border: 1px solid #51667c; background: #1a2a3d; color: #ecf4ff; }
    button { cursor: pointer; background: #1f6f78; border-color: #3aa6b3; }
    button.ghost { background: transparent; }
    .status { min-height: 24px; color: #ffd9a0; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인</div>
    <h1>내 자료실</h1>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <form id="login" hidden>
      <p>로그인해야 내 가상 메모를 볼 수 있습니다.</p>
      <input id="email" type="email" autocomplete="username" placeholder="이메일" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      <button type="submit">로그인</button>
    </form>

    <section id="app" hidden>
      <p>로그인: <span id="who"></span> <button class="ghost" id="logout" type="button">로그아웃</button></p>
      <form id="editor">
        <input id="title" maxlength="200" placeholder="제목" required>
        <textarea id="body" maxlength="5000" rows="3" placeholder="내용(가상 자료만 적어 주세요)"></textarea>
        <button type="submit" id="save">추가</button>
        <button type="button" class="ghost" id="cancel" hidden>수정 취소</button>
      </form>
      <ul id="notes" aria-live="polite"></ul>
    </section>
  </main>
  <script src="/supabase.js"></script>
  <script type="module">
    const $ = id => document.getElementById(id);
    const status = message => { $('status').textContent = message || ''; };
    let client;
    let token = null;
    let editingId = null;

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        cache: 'no-store',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      });
      if (response.status === 401) throw new Error('로그인이 만료되었습니다. 다시 로그인해 주세요.');
      if (!response.ok) throw new Error('요청을 처리하지 못했습니다.');
      return response.json();
    }

    function render(notes) {
      $('notes').replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        const actions = document.createElement('div');
        const edit = document.createElement('button');
        const remove = document.createElement('button');
        title.textContent = note.title;
        content.textContent = note.body;
        actions.className = 'actions';
        edit.type = remove.type = 'button';
        edit.textContent = '수정';
        remove.textContent = '삭제';
        edit.className = remove.className = 'ghost';
        edit.addEventListener('click', () => {
          editingId = note.id;
          $('title').value = note.title;
          $('body').value = note.body;
          $('save').textContent = '저장';
          $('cancel').hidden = false;
        });
        remove.addEventListener('click', () => run(async () => {
          await api(`/api/notes/${note.id}`, { method: 'DELETE' });
          await load();
        }));
        actions.append(edit, remove);
        item.append(title, content, actions);
        return item;
      }));
    }

    async function load() {
      const notes = await api('/api/notes');
      render(Array.isArray(notes) ? notes : []);
      if (!notes.length) status('아직 메모가 없습니다. 위에서 추가해 보세요.'); else status('');
    }

    async function run(work) {
      try { await work(); } catch (error) { status(error.message); }
    }

    function resetEditor() {
      editingId = null;
      $('editor').reset();
      $('save').textContent = '추가';
      $('cancel').hidden = true;
    }

    function show(session) {
      token = session?.access_token ?? null;
      $('login').hidden = !!session;
      $('app').hidden = !session;
      if (session) {
        $('who').textContent = session.user?.email ?? '';
        run(load);
      } else {
        $('notes').replaceChildren();
        resetEditor();
      }
    }

    async function start() {
      let config;
      try {
        config = await (await fetch('/auth-config.json', { cache: 'no-store' })).json();
      } catch { config = {}; }
      if (!config.supabaseUrl || !config.publishableKey) {
        status('로그인 설정이 아직 없습니다.');
        return;
      }
      client = window.supabase.createClient(config.supabaseUrl, config.publishableKey);
      client.auth.onAuthStateChange((_event, session) => show(session));
      const { data } = await client.auth.getSession();
      show(data.session);
    }

    $('login').addEventListener('submit', event => {
      event.preventDefault();
      run(async () => {
        const { error } = await client.auth.signInWithPassword({
          email: $('email').value, password: $('password').value });
        if (error) throw new Error('로그인에 실패했습니다. 이메일과 비밀번호를 확인해 주세요.');
        $('password').value = '';
      });
    });
    $('logout').addEventListener('click', () => run(async () => { await client.auth.signOut(); }));
    $('cancel').addEventListener('click', resetEditor);
    $('editor').addEventListener('submit', event => {
      event.preventDefault();
      run(async () => {
        const payload = JSON.stringify({ title: $('title').value, body: $('body').value });
        if (editingId) await api(`/api/notes/${editingId}`, { method: 'PUT', body: payload });
        else await api('/api/notes', { method: 'POST', body: payload });
        resetEditor();
        await load();
      });
    });
    start();
  </script>
</body>
</html>
